services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-s3cr3t}
      DATABASE_URL: ${DATABASE_URL:-mysql://root:root@db:3306/app?serverVersion=8.0.32}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379}
      REDIS_RATE_LIMITER_URL: ${REDIS_RATE_LIMITER_URL:-redis://redis:6379}
      PORT: ${PORT:-8080}
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always

volumes:
  mysql_data:
